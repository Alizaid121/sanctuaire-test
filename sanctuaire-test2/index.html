  button.secondary { background: #fff; color: var(--accent); }
  button.good { background: var(--good); border-color: var(--good); }
  button.danger { background: #fff; color: var(--bad); border-color: var(--bad); }

  .banner.ok { border-color: var(--good); color: var(--good); }

  .item { border-top: 1px solid var(--line); padding: 0.8rem 0.2rem; }

function el(tag, attrs, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v === false || v == null) continue;
    if (k === 'text') e.textContent = v;
    else if (k === 'class') e.className = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else if (v === true) e.setAttribute(k, '');

  const headers = { 'Content-Type': 'application/json', apikey: SUPABASE_KEY };

  if (!res.ok) { const err = new Error((body && (body.message || body.hint)) || `HTTP ${res.status}`); err.status = res.status; err.body = body; throw err; }
  return body;

    const r = await call('t2_login', { p_pin: pin });
    if (r && r.ok) { session = { token: r.token, role: r.role, label: r.label }; saveSession(session); await enter(); }
    else if (r && r.error === 'locked') { const mi = Math.ceil((r.retry_after || 60) / 60); loginMessage(`${I18N.en.locked(mi)}  /  ${I18N.fr.locked(mi)}`); }
    else loginMessage(`${I18N.en.wrong((r && r.remaining) || 0)}  /  ${I18N.fr.wrong((r && r.remaining) || 0)}`);
  } catch (e) { loginMessage(e.status === 404 ? `${I18N.en.connNoFn} / ${I18N.fr.connNoFn}` : `${I18N.en.connFail} / ${I18N.fr.connFail}`); }
  finally { $('loginBtn').disabled = false; $('pin').value = ''; }
}
async function checkConnection() {
  try { await call('t2_get_sheet', { p_token: 'connection-check' }); const m = $('loginMsg'); m.className = 'banner ok'; m.textContent = `${I18N.en.connOk}  /  ${I18N.fr.connOk}`; }
  catch (e) { const m = $('loginMsg'); m.className = 'banner err'; m.textContent = e.status === 404 ? `${I18N.en.connNoFn}  /  ${I18N.fr.connNoFn}` : `${I18N.en.connFail}  /  ${I18N.fr.connFail}`; }
}

/* ---------- entering the sheet ---------- */
async function enter() {
  LANG = SBar.lang();                          // follows the top-bar language (defaults by role at sign-in)
  document.documentElement.lang = LANG;
  $('loginCard').classList.add('hidden'); $('app').classList.remove('hidden');
  buildChrome();
  await refresh(true);
  startPoll();
}
function buildChrome() {
  document.title = `Sanctuaire · ${t('title')}`;
  $('appTitle').textContent = t('title');
  $('who').textContent = t('signedIn', session.role === 'admin' ? t('roleAdmin') : t('rolePartner'));
  $('how').textContent = session.role === 'admin' ? t('howAdmin') : t('howPartner');
  $('fStatusL').textContent = t('fStatus'); $('fCatL').textContent = t('fCat'); $('fSearchL').textContent = t('fSearch');
  $('fSearch').placeholder = t('searchPh');
  const fs = $('fStatus'); fs.replaceChildren(...['all', 'mine', 'other', 'open', 'agreed'].map((k) => el('option', { value: k, text: t('f_' + k) })));
  fs.value = ui.fStatus;
  const fc = $('fCat'); fc.replaceChildren(el('option', { value: 'all', text: t('f_all_cats') }), ...T2.CATEGORIES.map((c) => el('option', { value: c.id, text: c[LANG] })));
  fc.value = ui.fCat;
  const admin = session.role === 'admin';
  $('adminCard').classList.toggle('hidden', !admin);
  if (admin) {
    $('resetTitle').textContent = t('resetTitle'); $('resetHelp').textContent = t('resetHelp'); $('resetBtn').textContent = t('reset'); $('resetWord').placeholder = 'RESET';
  }
}

/* ---------- loading data ---------- */
async function refresh(force, quiet) {
  if (!session) return;
  if (!force && isEditing()) return;
  try {
    const r = await call('t2_get_sheet', { p_token: session.token });
    if (!r.ok) { if (r.error === 'auth') { clearSession(); return showLogin(I18N.en.sessionEnded + ' / ' + I18N.fr.sessionEnded); } return; }
    const hash = JSON.stringify([r.items, r.events]);
    if (hash === sheet.hash && !force) return;
    sheet.hash = hash; sheet.items = {}; sheet.events = {};
    for (const i of r.items) sheet.items[i.sid] = i;
    for (const e of r.events) (sheet.events[e.sid] = sheet.events[e.sid] || []).push(e);
    renderAll();
  } catch (e) { if (!quiet) flash(t('errs').default, 'err'); }
}
function isEditing() { const a = document.activeElement; return a && ['TEXTAREA', 'INPUT', 'SELECT'].includes(a.tagName) && $('app').contains(a); }
function startPoll() { stopPoll(); pollTimer = setInterval(() => { if (!busy && !document.hidden) refresh(false, true); }, POLL_MS); }
function stopPoll() { if (pollTimer) clearInterval(pollTimer); pollTimer = null; }
function flash(text, kind) { const m = $('msg'); m.textContent = text; m.className = `banner ${kind || ''}`; if (kind === 'ok') setTimeout(() => { if (m.textContent === text) m.classList.add('hidden'); }, 2500); }

/* ---------- status logic ---------- */
function statusOf(sid) { const it = sheet.items[sid]; return it ? it.status : 'pending'; }
const MINE = { partner: ['pending', 'rejected'], admin: ['suggested', 'countered'] };
function isMine(sid) { return MINE[session.role].includes(statusOf(sid)); }
function chipLabel(sid) {
  const it = sheet.items[sid]; const st = statusOf(sid);
  if (st === 'agreed') return t(it.final_kind === 'original' ? 's_agreed_orig' : 's_agreed_new');
  return t('s_' + st);
}
function matchesFilter(s) {
  const st = statusOf(s.id);
  if (ui.fCat !== 'all' && s.cat !== ui.fCat) return false;
  if (ui.fStatus === 'mine' && !isMine(s.id)) return false;
  if (ui.fStatus === 'other' && (st === 'agreed' || isMine(s.id))) return false;
  if (ui.fStatus === 'open' && st === 'agreed') return false;
  if (ui.fStatus === 'agreed' && st !== 'agreed') return false;
  if (ui.q) { const q = ui.q.toLowerCase(); if (!(s.en.toLowerCase().includes(q) || s.fr.toLowerCase().includes(q) || s.id.includes(q))) return false; }
  return true;
}
function counts() {
  const c = { total: T2.STRINGS.length, agreed: 0, mine: 0, other: 0 };
  for (const s of T2.STRINGS) { const st = statusOf(s.id); if (st === 'agreed') c.agreed++; else if (isMine(s.id)) c.mine++; else c.other++; }
  return c;
}

/* ---------- drawing ---------- */
function renderAll() {
  const c = counts();
  $('stats').replaceChildren(
    el('div', { class: 'stat' }, el('b', { text: c.total }), t('st_total')),
    el('div', { class: 'stat' }, el('b', { text: c.agreed }), t('st_agreed')),
    el('div', { class: 'stat' }, el('b', { text: c.mine }), t('st_mine')),
    el('div', { class: 'stat' }, el('b', { text: c.other }), t('st_other')));
  $('barFill').style.width = `${Math.round((100 * c.agreed) / c.total)}%`;
  $('barText').textContent = t('barText', c.agreed, c.total);
  const list = $('list'); list.replaceChildren();
  let shown = 0;
  for (const cat of T2.CATEGORIES) {
    const all = T2.STRINGS.filter((s) => s.cat === cat.id);
    const items = all.filter(matchesFilter);
    if (!items.length) continue;
    shown += items.length;
    const done = all.filter((s) => statusOf(s.id) === 'agreed').length;
    const open = ui.openCats.has(cat.id) || ui.fStatus !== 'all' || !!ui.q || ui.fCat !== 'all';
    const d = el('details', { class: 'cat', open }, el('summary', {}, el('span', { text: cat[LANG] }), el('small', { text: `${done}/${all.length}` })), el('div', { class: 'cat-body' }, items.map(renderItem)));
    d.addEventListener('toggle', () => { if (d.open) ui.openCats.add(cat.id); else ui.openCats.delete(cat.id); });
    list.append(d);
  }
  if (!shown) list.append(el('p', { class: 'card muted', text: t('noResults') }));
}

function phNote(s) {
  if (!s.ph.length) return null;
  return el('div', { class: 'hint' }, t('keep', s.ph.map((p) => `{${p}} = ${tx('ph', p)}`).join(' · ')));
}
function renderItem(s) {
  const st = statusOf(s.id), it = sheet.items[s.id], evs = sheet.events[s.id] || [];
  const note = LANG === 'fr' ? s.note_fr : s.note_en;
  const box = el('div', { class: 'item', id: 'i-' + s.id });
  box.append(el('div', { class: 'meta' }, el('code', { text: s.id }), el('span', { text: `${tx('types', s.type)}` }), el('span', { text: '· ' + T2.SCREENS[s.screen][LANG] }), el('span', { class: `chip ${st}`, text: chipLabel(s.id) })));
  box.append(el('div', { class: 'en', text: s.en }));
  if (st === 'agreed') box.append(el('div', { class: 'frbox fin' }, el('small', { text: t('final') }), it.final_fr));
  else box.append(el('div', { class: 'frbox' }, el('small', { text: t('proposed') }), s.fr));
  if (st !== 'pending' && st !== 'agreed' && it.sug_fr) box.append(el('div', { class: 'frbox sug' }, el('small', { text: t('suggestedBy') + (it.sug_reason ? ` · ${t('r_' + it.sug_reason)}` : '') }), it.sug_fr, it.sug_note ? el('div', { class: 'hint', text: it.sug_note }) : null));
  if (st === 'agreed' && it.final_kind === 'suggestion') box.append(el('div', { class: 'hint', text: `${t('proposed')}: ${s.fr}` }));
  box.append(el('div', { class: 'hint', text: t('space', s.max, tx('types', s.type)) }));
  if (note) box.append(el('div', { class: 'hint', text: `${t('note')}: ${note}` }));
  for (const ch of (s.flags || '')) { const fn = FLAGS[LANG][ch]; if (fn) box.append(el('div', { class: 'hint', text: fn })); }
  const pn = phNote(s); if (pn) box.append(pn);
  box.append(...actionsFor(s, st, it));
  if (evs.length) box.append(el('details', { class: 'hist' }, el('summary', { text: t('history', evs.length) }), evs.map(renderEvent)));
  return box;
}
function renderEvent(e) {
  const who = tx('by', e.actor);
  const lines = [el('div', {}, el('b', { text: `${who} ` }), tx('ev', e.kind))];
  if (e.fr_text && ['suggest', 'counter'].includes(e.kind)) lines.push(el('div', { text: `→ ${e.fr_text}` }));
  if (e.reason) lines.push(el('div', { class: 'hint', text: t('r_' + e.reason) }));
  if (e.note) lines.push(el('div', { text: `“${e.note}”` }));
  return el('div', { class: `ev ${e.actor}` }, el('time', { text: fmtTime(e.at) }), lines);
}

function actionsFor(s, st, it) {
  const out = []; const role = session.role; const f = ui.forms[s.id];
  const btn = (label, cls, fn) => el('button', { class: cls || '', type: 'button', onclick: fn, text: label });
  if (f) { out.push(renderForm(s, f)); return out; }
  const row = (...b) => el('div', { class: 'row' }, b);
  if (role === 'partner') {
    if (st === 'pending') out.push(row(btn(t('approve'), 'good', () => act(s.id, 'approve')), btn(t('suggest'), 'secondary', () => openForm(s.id, { mode: 'suggest', fr: s.fr, reason: '', note: '' }))));
    else if (st === 'rejected') out.push(row(btn(t('counter'), '', () => openForm(s.id, { mode: 'counter', fr: it.sug_fr || s.fr, reason: it.sug_reason || '', note: '' })), btn(t('accept'), 'secondary', () => act(s.id, 'accept'))));
    else if (st === 'suggested' || st === 'countered') out.push(el('p', { class: 'hint', text: t('waitYou') }), row(btn(t('accept'), 'secondary', () => act(s.id, 'accept'))));
  } else {
    if (st === 'pending') out.push(el('p', { class: 'hint', text: t('waitHer') }));
    else if (st === 'suggested' || st === 'countered') out.push(row(btn(t('aApprove'), 'good', () => act(s.id, 'admin_approve')), btn(t('aReject'), 'danger', () => openForm(s.id, { mode: 'reject', note: '' })), btn(t('aKeep'), 'secondary', () => act(s.id, 'admin_keep'))));
    else if (st === 'rejected') out.push(el('p', { class: 'hint', text: t('waitHer') }), row(btn(t('aApprove'), 'good', () => act(s.id, 'admin_approve')), btn(t('aKeep'), 'secondary', () => act(s.id, 'admin_keep'))));
    else if (st === 'agreed') out.push(row(btn(t('aReopen'), 'secondary', () => act(s.id, 'admin_reopen'))));
  }
  return out;
}
function openForm(sid, f) { ui.forms[sid] = f; renderAll(); const n = document.getElementById('i-' + sid) && document.getElementById('i-' + sid).querySelector('textarea'); if (n) n.focus(); }
function closeForm(sid) { delete ui.forms[sid]; renderAll(); }

function renderForm(s, f) {
  const form = el('div', { class: 'form' });
  const err = el('div', { class: 'banner err hidden', role: 'alert' });
  let frInput = null, reasonSel = null, noteInput;
  if (f.mode !== 'reject') {
    const cnt = el('div', { class: 'count' });
    const upd = () => { const n = [...f.fr || ''].length; cnt.textContent = `${n}/${s.max}`; cnt.classList.toggle('over', n > s.max); if (n > s.max) cnt.textContent += ` · ${t('overSpace')}`; };
    frInput = el('textarea', { id: `fr-${s.id}`, 'aria-label': t('yourFrench'), lang: 'fr', oninput: (e) => { f.fr = e.target.value; upd(); } });
    frInput.value = f.fr || '';
    form.append(el('label', { for: `fr-${s.id}`, text: t('yourFrench') }), frInput, cnt, ...(phNote(s) ? [phNote(s)] : []));
    reasonSel = el('select', { id: `rs-${s.id}`, onchange: (e) => { f.reason = e.target.value; } }, el('option', { value: '', text: t('reasonNone') }), ['long', 'unnatural', 'meaning', 'register', 'grammar', 'gender', 'other'].map((k) => el('option', { value: k, text: t('r_' + k) })));
    reasonSel.value = f.reason || '';
    form.append(el('label', { for: `rs-${s.id}`, text: t('reason') }), reasonSel);
    upd();
  }
  const noteLabel = f.mode === 'suggest' ? t('noteOpt') : t('noteReq');
  noteInput = el('textarea', { id: `nt-${s.id}`, class: 'short', oninput: (e) => { f.note = e.target.value; } });
  noteInput.value = f.note || '';
  form.append(el('label', { for: `nt-${s.id}`, text: f.mode === 'counter' ? t('noteReq') : noteLabel }), noteInput, err);
  const fail = (m) => { err.textContent = m; err.classList.remove('hidden'); };
  const send = el('button', { type: 'button', text: t('send'), onclick: async () => {
    const fr = (f.fr || '').trim(), note = (f.note || '').trim();
    if (f.mode === 'suggest' || f.mode === 'counter') {
      if (!fr) return fail(t('needText'));
      if (f.mode === 'suggest' && fr === s.fr) return fail(t('sameText'));
      const miss = s.ph.filter((p) => !fr.includes(`{${p}}`));
      if (miss.length) return fail(t('phMissing', miss.map((p) => `{${p}}`).join(', ')));
    }
    if ((f.mode === 'counter' || f.mode === 'reject') && !note) return fail(t('needNote'));
    const action = { suggest: 'suggest', counter: 'counter', reject: 'admin_reject' }[f.mode];
    await act(s.id, action, { fr: f.mode === 'reject' ? null : fr, reason: f.reason || null, note: note || null });
  } });
  form.append(el('div', { class: 'row' }, send, el('button', { type: 'button', class: 'secondary', text: t('cancel'), onclick: () => closeForm(s.id) })));
  return form;
}

/* ---------- actions ---------- */
async function act(sid, action, extra) {
  extra = extra || {}; busy++;
  flash(t('sending'));
  try {
    const r = await call('t2_act', { p_token: session.token, p_sid: sid, p_action: action, p_orig: STR[sid].fr, p_fr: extra.fr || null, p_reason: extra.reason || null, p_note: extra.note || null });
    if (r.ok) { delete ui.forms[sid]; flash(t('saved'), 'ok'); }
    else if (r.error === 'auth') { clearSession(); return showLogin(I18N.en.sessionEnded + ' / ' + I18N.fr.sessionEnded); }
    else { flash(t('errs')[r.error] || t('errs').default, 'err'); if (r.error === 'wrong_state') delete ui.forms[sid]; }
  } catch (e) { flash(t('errs').default, 'err'); }
  finally { busy--; }
  await refresh(true, true);
}

/* ---------- PDF report (admin) ---------- */
function loadScript(src) { return new Promise((res, rej) => { const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = () => rej(new Error('load ' + src)); document.head.append(s); }); }
async function fetchB64(url) { const r = await fetch(url); if (!r.ok) throw new Error('font'); const b = new Uint8Array(await r.arrayBuffer()); let s = ''; for (let i = 0; i < b.length; i += 0x8000) s += String.fromCharCode.apply(null, b.subarray(i, i + 0x8000)); return btoa(s); }
async function doReset() {
  const r = await call('t2_reset_all', { p_token: session.token, p_confirm: $('resetWord').value.trim() });
  if (r.ok) { $('resetWord').value = ''; ui.forms = {}; flash(t('resetDone'), 'ok'); await refresh(true, true); }
  else flash(t('errs')[r.error] || t('errs').default, 'err');
}

/* ---------- start ---------- */
$('loginBtn').addEventListener('click', doLogin);
$('pin').addEventListener('keydown', (e) => { if (e.key === 'Enter') doLogin(); });
$('checkBtn').addEventListener('click', checkConnection);
$('fStatus').addEventListener('change', (e) => { ui.fStatus = e.target.value; renderAll(); });
$('fCat').addEventListener('change', (e) => { ui.fCat = e.target.value; renderAll(); });
$('fSearch').addEventListener('input', (e) => { ui.q = e.target.value.trim(); renderAll(); });
$('resetBtn').addEventListener('click', doReset);
document.addEventListener('visibilitychange', () => { if (!document.hidden && session) refresh(false, true); });
if (loadSession()) enter().catch(() => showLogin()); else showLogin();
window.addEventListener('sanctuaire-lang', (e) => { LANG = e.detail; document.documentElement.lang = LANG; buildChrome(); refresh(true, true); });
</script>
